
services:

    linux_service:
        hostname: linux_service
        restart: always
        container_name: linux_service
        image: linux_service_image
        privileged: true

        ports:
          - "22022:22"   # SSH 🔐
          - "8888:80"    # nginx 🌐
        # tty: true

        volumes:
          - /sys/fs/cgroup:/sys/fs/cgroup:rw

        # environment:
        #     - PLUTUS_CONFIG=/plutus/configs/connector.config.m2.json
